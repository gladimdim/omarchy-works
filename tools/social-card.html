<!doctype html>
<!-- Source of assets/social-card.jpg. Render with tools/render-social-card.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omarchy Works social card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #10100f; }
  .card { position: relative; width: 1200px; height: 630px; color: #ece8e5; font-family: "Space Grotesk", sans-serif; }
  .art { position: absolute; inset: 0; background: url(../assets/img/hero-dark.webp) 78% 30% / cover no-repeat; }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, #10100f 0%, rgba(16,16,15,.96) 44%, rgba(16,16,15,.35) 78%, rgba(16,16,15,.15) 100%);
  }
  .copy { position: absolute; z-index: 1; left: 72px; top: 64px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; }
  .brand .dim { color: #a39e99; font-weight: 600; }
  .mark { width: 26px; height: 26px; border-radius: 6px; border: 5px solid #dbb471; box-shadow: inset 0 0 0 4px #10100f, inset 0 0 0 13px #72bac5; }
  h1 { margin: 54px 0 0; font-size: 92px; line-height: .96; letter-spacing: -.045em; }
  h1 span { color: #dbb471; }
  .list { margin: 34px 0 0; font: 600 21px/1.5 "JetBrains Mono", monospace; color: #d1cdc9; }
  .list b { color: #72bac5; font-weight: 600; }
  .by { position: absolute; left: 72px; bottom: 54px; z-index: 1; font: 500 20px/1 "JetBrains Mono", monospace; color: #a39e99; }
  .by strong { color: #ece8e5; }
  .shots { position: absolute; z-index: 1; right: 56px; bottom: 50px; width: 420px; height: 300px; }
  .shots img { position: absolute; border-radius: 12px; border: 3px solid #2e2d2b; box-shadow: 0 24px 60px -20px #000; }
  .sd { width: 400px; right: 30px; bottom: 30px; transform: rotate(-4deg); }
  .watch { width: 190px; border-radius: 50% !important; right: -12px; bottom: -14px; border: 6px solid #2a2a28 !important; }
</style>
</head>
<body>
<div class="card">
  <div class="art"></div>
  <div class="copy">
    <div class="brand"><span class="mark"></span>omarchy<span class="dim">.works</span></div>
    <h1>Tools I build<br>for <span>Omarchy</span>.</h1>
    <p class="list">SUPER DESKTOP <b>·</b> Omakey <b>·</b> AI Watch<br>plugins <b>·</b> themes <b>·</b> open source</p>
  </div>
  <div class="shots">
    <img class="sd" src="../assets/img/super-desktop.webp" alt="">
    <img class="watch" src="../assets/img/watchface.webp" alt="">
  </div>
  <p class="by">by <strong>Dmytro Gladkyi</strong> · omarchy.dmytrogladkyi.com</p>
</div>
</body>
</html>
